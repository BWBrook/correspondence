[project]
name = "correspondence"
version = "0.1.0"
description = "Private asynchronous correspondence for humans and assistants"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "mcp>=1.12,<2"]

[project.scripts]
correspondence-web = "correspondence.web:main"
correspondence-mcp = "correspondence.mcp_server:main"
correspondence-export = "correspondence.export:main"
correspondence-turn-hook = "correspondence.turn_hook:main"
correspondence-dispatch = "correspondence.dispatch:main"
correspondence-courier = "correspondence.courier:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
